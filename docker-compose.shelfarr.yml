# Shelfarr — Overseerr-style request + auto-download portal for books/audiobooks.
# Searches via Prowlarr, grabs via Transmission (or any *arr-style download client),
# and delivers finished files straight into your BookOrbit library folders.
#
# Deploy: Portainer -> Stacks -> Add stack -> paste this -> set the Environment variables
# from .env.shelfarr.example (or use a .env file for `docker compose up -d`).
#
# IMPORTANT (learned the hard way 2026-09-12): Shelfarr keeps its ENTIRE state in
# /rails/storage — the SQLite DBs (production.sqlite3 = settings/requests/tokens,
# production_queue.sqlite3 = Solid Queue), plus /rails/storage/.encryption_keys and
# .secret_key_base (auto-generated by the entrypoint, REUSED when the file already
# exists). If /rails/storage is NOT on a persistent volume, every container recreate
# (e.g. a Watchtower image update) starts with a fresh DB + fresh keys = total wipe of
# all settings/tokens. So the host volume MUST mount to /rails/storage (NOT /data, which
# this app does not use). With this mount, Watchtower updates are safe.
#
# SOLID_QUEUE_IN_PUMA=1 makes Puma start the Solid Queue worker in-process on every boot
# (Shelfarr's puma.rb has the hook). Without it, requests/library-sync/download-monitor
# jobs enqueue but never run, so nothing downloads and the library never syncs.

name: shelfarr

services:
  shelfarr:
    container_name: shelfarr
    image: ${SHELFARR_IMAGE:-ghcr.io/pedro-revez-silva/shelfarr:latest}
    restart: unless-stopped
    ports:
      - "${SHELFARR_PORT:-5056}:80"
    environment:
      RAILS_ENV: production
      TZ: ${TZ:-America/New_York}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Run the Solid Queue background worker inside Puma (survives every restart/update).
      SOLID_QUEUE_IN_PUMA: "1"
    volumes:
      # Shelfarr's DB + encryption keys live in /rails/storage — this MUST be the persistent mount.
      - ${SHELFARR_DATA_HOST_PATH:?set in .env}:/rails/storage
      - ${EBOOKS_HOST_PATH:?set in .env}:/ebooks
      - ${AUDIOBOOKS_HOST_PATH:?set in .env}:/audiobooks
      - ${DOWNLOADS_HOST_PATH:?set in .env}:/downloads
